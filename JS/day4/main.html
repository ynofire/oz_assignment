<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 암호화폐 시세</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-mark">₿</div>
                <div>
                    <h1>실시간 암호화폐</h1>
                    <p class="subtitle">Binance USDT 마켓</p>
                </div>
            </div>
            <div class="status">
                <span class="live-dot" id="liveDot"></span>
                <span id="statusText">연결 중…</span>
                <span class="last-update" id="lastUpdate"></span>
            </div>
        </header>

        <div class="toolbar">
            <div class="tabs" role="tablist" aria-label="코인 목록 보기">
                <button class="tab active" role="tab" aria-selected="true" data-tab="all">전체보기</button>
                <button class="tab" role="tab" aria-selected="false" data-tab="favorites">
                    관심항목 <span class="badge" id="favCount">0</span>
                </button>
            </div>
            <div class="search">
                <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                </svg>
                <input id="searchInput" type="text" placeholder="코인 검색 (예: BTC)" autocomplete="off">
                <button class="clear-search" id="clearSearch" type="button" aria-label="검색어 지우기" hidden>×</button>
            </div>
        </div>

        <div class="error-banner" id="errorBanner" hidden></div>

        <div class="table-wrap">
            <div class="table-head">
                <span></span>
                <span class="th-name">코인</span>
                <span class="th-price">현재가</span>
                <span class="th-change">24시간</span>
                <span class="th-volume">거래량 (24h)</span>
            </div>
            <div id="list" class="list"></div>
            <div id="empty" class="empty">
                <svg class="empty-icon" viewBox="0 0 24 24" width="36" height="36" fill="none"
                     stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M3 17l5.5-6 3.5 3.5L21 6"></path>
                    <path d="M15 6h6v6"></path>
                </svg>
                <p class="empty-title" id="emptyTitle">시세를 불러오는 중…</p>
                <p class="empty-desc" id="emptyDesc">잠시만 기다려 주세요.</p>
            </div>
        </div>
    </div>

    <script src="engine.js"></script>
</body>
</html>
